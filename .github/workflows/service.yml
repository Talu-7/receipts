name: service
on:
  push:
    branches: [dev]
    paths: ["service/**", "receipts/**", ".github/workflows/service.yml"]
  pull_request:
    paths: ["service/**", "receipts/**", ".github/workflows/service.yml"]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r service/requirements-dev.txt
      - run: python -m pytest service/tests -q
